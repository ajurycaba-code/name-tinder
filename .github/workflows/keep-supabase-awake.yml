name: Keep Supabase awake

# O plano gratuito do Supabase pausa o projeto depois de ~7 dias sem nenhuma
# requisição, e ao pausar ele derruba o subdomínio do projeto. O app continua
# no ar no GitHub Pages, mas não acha mais o banco e cai na tela de erro.
#
# Este workflow faz uma consulta mínima a cada dois dias só para marcar
# atividade. Se a consulta falhar, o job falha de propósito: assim chega um
# e-mail do GitHub avisando antes de alguém descobrir pelo app quebrado.

on:
  schedule:
    # A cada dois dias, 07:10 UTC (~04:10 em Brasília). O minuto não é 0 porque
    # a fila do GitHub Actions é mais disputada na virada da hora.
    - cron: '10 7 */2 * *'
  workflow_dispatch:

# Só um ping por vez; se um atrasar, não enfileira outro em cima.
concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Faltam os secrets VITE_SUPABASE_URL e/ou VITE_SUPABASE_ANON_KEY."
            exit 1
          fi

          url="${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1"

          # Três tentativas: uma falha de rede do runner não deve virar alarme.
          for tentativa in 1 2 3; do
            codigo=$(curl -sS -m 30 -o corpo.txt -w '%{http_code}' "$url" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo 000)

            if [ "$codigo" = "200" ]; then
              echo "Banco respondeu 200 na tentativa $tentativa."
              exit 0
            fi

            echo "Tentativa $tentativa: HTTP $codigo"
            sed -n '1,5p' corpo.txt 2>/dev/null || true
            [ "$tentativa" -lt 3 ] && sleep 20
          done

          echo "::error::O banco não respondeu 200 em tres tentativas (último código: $codigo). O projeto do Supabase pode estar pausado."
          exit 1
